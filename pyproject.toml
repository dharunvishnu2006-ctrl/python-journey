[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cloudshield-x"
version = "0.1.0"
description = "AI-Powered Cloud Security Platform"
authors = [
    {name = "J. Dharun Vishnu", email = "dharun@example.com"}
]
keywords = ["security", "cloud", "AI", "CSPM"]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "flask>=3.0"
]

[project.urls]
Homepage = "https://github.com/dharunvishnu2006-ctrl/cloudshield-x"